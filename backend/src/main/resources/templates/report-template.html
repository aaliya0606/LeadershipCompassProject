<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            color: #222;
        }

        h1 {
            color: #1f4e79;
        }

        .section {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
<h1>Leadership Compass Report</h1>

<p><strong>Name:</strong> <span th:text="${name}"></span></p>
<p><strong>Role:</strong> <span th:text="${role}"></span></p>

<div class="section">
    <h2>Leadership Summary</h2>
    <p th:text="${summary}"></p>
</div>

<div class="section">
    <h2>Development Focus</h2>
    <p th:text="${developmentFocus}"></p>
</div>
</body>
</html>
