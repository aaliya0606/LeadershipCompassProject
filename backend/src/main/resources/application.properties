spring.application.name=LeadershipCompass_CapstoneProjectBackend

spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.sbdlgxujnoqwykjervrb
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.modules.seed.enabled=false
app.modules.seed.path=classpath*:seed/modules/*.json

jwt.secret=ThisIsASecretKeyForLeadershipCompassJwtAuthenticationMustBeLongEnough
jwt.expiration=86400000

app.ai-brain.enabled=true
app.ai-brain.base-url=http://127.0.0.1:8000
app.ai-brain.timeout-seconds=120
app.ai-brain.limits.chat-max-requests=12
app.ai-brain.limits.chat-window-seconds=600
app.ai-brain.limits.plan-max-requests=3
app.ai-brain.limits.plan-window-seconds=3600
app.ai-brain.limits.user-max-concurrent=1
app.ai-brain.limits.global-max-concurrent=6

# Resource Library - Supabase Storage
app.resource-storage.provider=SUPABASE
app.resource-storage.supabase-url=https://sbdlgxujnoqwykjervrb.supabase.co
app.resource-storage.supabase-bucket=resource-library
app.resource-storage.supabase-secret-key=${SUPABASE_SECRET_KEY}

# Outbound email for plan nudges, sign-in codes, and password reset.
# Stays off until APP_MAIL_ENABLED=true and SMTP or Graph credentials are set.
# provider=smtp defaults to Gmail. Set MAIL_HOST=smtp.office365.com for M365 SMTP.
# provider=graph uses Microsoft Graph sendMail.
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.provider=${APP_MAIL_PROVIDER:smtp}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:Leadership Compass}
app.mail.reply-to=${MAIL_REPLY_TO:theteam@theguineagroup.com.au}
app.mail.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.mail.public-site-url=${APP_PUBLIC_SITE_URL:https://delightful-forest-04c15c700.5.azurestaticapps.net}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.graph.tenant-id=${GRAPH_TENANT_ID:}
app.mail.graph.client-id=${GRAPH_CLIENT_ID:}
app.mail.graph.client-secret=${GRAPH_CLIENT_SECRET:}
app.mail.graph.sender=${GRAPH_SENDER:no-reply@theguineagroup.com.au}

# Local-only overrides. Missing file is ignored, so Azure does not need it.
# Loaded from the backend folder or the repo root, whichever is the working directory.
spring.config.import=optional:file:./config/local.properties,optional:file:./backend/config/local.properties
