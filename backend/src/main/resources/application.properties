spring.application.name=LeadershipCompass_CapstoneProjectBackend

spring.datasource.url=jdbc:postgresql://localhost:5432/leadership_compass
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.modules.seed.enabled=false
app.modules.seed.path=classpath*:seed/modules/*.json

jwt.secret=ThisIsASecretKeyForLeadershipCompassJwtAuthenticationMustBeLongEnough
jwt.expiration=86400000
