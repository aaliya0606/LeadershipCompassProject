spring.application.name=LeadershipCompass_CapstoneProjectBackend

spring.datasource.url=jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.sbdlgxujnoqwykjervrb
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

app.modules.seed.enabled=false
app.modules.seed.path=classpath*:seed/modules/*.json

jwt.secret=ThisIsASecretKeyForLeadershipCompassJwtAuthenticationMustBeLongEnough
jwt.expiration=86400000

app.ai-brain.enabled=true
app.ai-brain.base-url=http://127.0.0.1:8000
app.ai-brain.timeout-seconds=120

# Resource Library - Supabase Storage
app.resource-storage.provider=SUPABASE
app.resource-storage.supabase-url=https://sbdlgxujnoqwykjervrb.supabase.co
app.resource-storage.supabase-bucket=resource-library
app.resource-storage.supabase-secret-key=${SUPABASE_SECRET_KEY}

# Plan email. Stays off until TGG provides M365 SMTP auth (app password) or a Graph app secret.
# provider=smtp uses smtp.office365.com. provider=graph uses Microsoft Graph sendMail.
app.mail.enabled=false
app.mail.provider=smtp
app.mail.from=no-reply@theguineagroup.com.au
app.mail.from-name=Leadership Compass
app.mail.reply-to=theteam@theguineagroup.com.au
app.mail.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

spring.mail.host=${MAIL_HOST:smtp.office365.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.graph.tenant-id=${GRAPH_TENANT_ID:}
app.mail.graph.client-id=${GRAPH_CLIENT_ID:}
app.mail.graph.client-secret=${GRAPH_CLIENT_SECRET:}
app.mail.graph.sender=${GRAPH_SENDER:no-reply@theguineagroup.com.au}
