<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Learning Modules | Leadership Compass</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static/style/main.css" />
  </head>

  <body>
    <nav class="navbar navbar-dark px-4 custom-navbar">
      <a href="dashboard.html" class="navbar-brand">Leadership Compass — Admin</a>
      <div>
        <a href="dashboard.html" class="btn btn-light me-2">Dashboard</a>
        <button id="logoutBtn" class="btn btn-outline-light">Logout</button>
      </div>
    </nav>

    <main class="container mt-5 mb-5">
      <div class="dashboard-card">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
          <div>
            <span class="eyebrow text-uppercase">Admin</span>
            <h1 class="h3 mb-1">Learning Modules</h1>
            <p class="text-muted mb-0">View, sort, add, edit, and delete modules across the system.</p>
          </div>
          <button id="addModuleBtn" type="button" class="btn btn-success">Add module</button>
        </div>

        <div id="pageAlert" class="alert d-none" role="alert"></div>

        <div class="row g-3 align-items-end mb-4">
          <div class="col-md-4">
            <label for="sortBy" class="form-label">Sort by</label>
            <select id="sortBy" class="form-select">
              <option value="id">Module ID</option>
              <option value="category">Category</option>
              <option value="book">Book</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="sortDirection" class="form-label">Direction</label>
            <select id="sortDirection" class="form-select">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </div>
          <div class="col-md-3">
            <button id="refreshBtn" type="button" class="btn btn-primary w-100">Refresh list</button>
          </div>
          <div class="col-md-2 text-md-end">
            <span id="moduleCount" class="badge bg-light text-dark">0 modules</span>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Category</th>
                <th>Book</th>
                <th>Title</th>
                <th>Order</th>
                <th>Active</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="modulesTableBody">
              <tr>
                <td colspan="7" class="text-muted">Loading modules...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="modal fade" id="moduleModal" tabindex="-1" aria-labelledby="moduleModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="moduleModalLabel">Module</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body module-modal-body">
            <form id="moduleForm">
              <div id="formAlert" class="alert alert-danger d-none"></div>

              <div class="row g-3">
                <div class="col-md-6">
                  <label for="moduleCategory" class="form-label">Category</label>
                  <select class="form-select" id="moduleCategory" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="Words of Recognition">Words of Recognition</option>
                    <option value="Caring Time">Caring Time</option>
                    <option value="Acts of Support">Acts of Support</option>
                    <option value="Psychological Touch">Psychological Touch</option>
                    <option value="Receiving Value">Receiving Value</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label for="moduleBook" class="form-label">Book</label>
                  <input type="text" class="form-control" id="moduleBook" required maxlength="200" />
                </div>
                <div class="col-12">
                  <label for="moduleTitle" class="form-label">Title</label>
                  <input type="text" class="form-control" id="moduleTitle" required maxlength="200" />
                </div>
                <div class="col-12">
                  <label for="moduleDescription" class="form-label">Description</label>
                  <textarea class="form-control" id="moduleDescription" rows="3" maxlength="2000"></textarea>
                </div>
                <div class="col-md-4">
                  <label for="moduleDisplayOrder" class="form-label">Display order</label>
                  <input type="number" class="form-control" id="moduleDisplayOrder" required min="0" value="0" />
                </div>
                <div class="col-md-4 d-flex align-items-end">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="moduleActive" checked />
                    <label class="form-check-label" for="moduleActive">Active</label>
                  </div>
                </div>
              </div>

              <hr class="my-4" />
              <p class="small text-muted mb-3">Enter one item per line for each list field.</p>

              <div class="mb-3">
                <label for="moduleSourceChapters" class="form-label">Source chapters</label>
                <textarea class="form-control font-monospace" id="moduleSourceChapters" rows="3"></textarea>
              </div>
              <div class="mb-3">
                <label for="moduleChecklist" class="form-label">Checklist</label>
                <textarea class="form-control font-monospace" id="moduleChecklist" rows="4"></textarea>
              </div>
              <div class="mb-3">
                <label for="moduleQuotes" class="form-label">Quotes and concepts</label>
                <textarea class="form-control font-monospace" id="moduleQuotes" rows="4"></textarea>
              </div>
              <div class="mb-0">
                <label for="moduleActivities" class="form-label">Activities</label>
                <textarea class="form-control font-monospace" id="moduleActivities" rows="4"></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" form="moduleForm" class="btn btn-primary" id="saveModuleBtn">Save module</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="static/js/admin-modules.js"></script>
  </body>
</html>
