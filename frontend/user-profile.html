<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Survey | Leadership Compass </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="static/style/main.css" rel="stylesheet" />
    <link href="static/style/sidebar.css" rel="stylesheet" />
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark px-4 custom-navbar">
        <a href="dashboard.html" class="navbar-brand d-flex align-items-center gap-2">
            <img src="static/img/image-1778063971066.png" alt="TGG Logo" class="navbar-logo" />
            <span class="brand-title"> Leadership Compass </span>
        </a>
    </nav>

    <div class="app">
        <aside class="sidebar">
            <div class="logo-row">
                <div class="logo-mark"></div>
                <div class="logo-text">Leadership Compass</div>
            </div>

            <div class="avatar-block">
                <div class="avatar-wrap">
                    <div class="avatar">AT</div>
                    <div class="avatar-edit">+</div>
                </div>
                <div class="avatar-name">Anton Turner</div>
            </div>

            <nav>
                <div class="nav-item active">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Account Settings
                </div>
                <div class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    Personal Information
                </div>
                <div class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    Privacy
                </div>
                <div class="nav-item">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                    Notification
                </div>
            </nav>

            <div class="sign-out">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sign Out
            </div>
        </aside>

        <main class="main">
            <h1 class="title">Account Settings</h1>

            <div class="grid">
                <div class="field">
                    <label>First name</label>
                    <div class="input-wrap"><input type="text" value="Anton"></div>
                </div>
                <div class="field">
                    <label>Last name</label>
                    <div class="input-wrap"><input type="text" value="Turner"></div>
                </div>

                <div class="field">
                    <label>Username</label>
                    <div class="input-wrap"><input type="text" value="anton.t"></div>
                </div>
                <div class="field">
                    <label>Password</label>
                    <div class="input-wrap"><input type="password" value="123456"><span class="pencil">&#9998;</span></div>
                </div>

                <div class="field">
                    <label>E-mail</label>
                    <div class="input-wrap"><input type="text" value="anton.turner@leadershipcompass.com"><span class="pencil">&#9998;</span></div>
                </div>
                <div class="field">
                    <label>Phone number</label>
                    <div class="input-wrap"><input type="text" value="+61 400 123 456"><span class="pencil">&#9998;</span></div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-save">Save</button>
                <button class="btn-cancel">Cancel</button>
            </div>
        </main>
    </div>

</body>
</html>
