<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Survey | Leadership Compass </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="static/style/main.css" />
    <link rel="stylesheet" href="static/style/sidebar.css" />

</head>

<body>
    <header class="navbar navbar-dark px-4 custom-navbar">
        <a href="dashboard.html" class="navbar-brand d-flex align-items-center gap-2">
            <img src="static/img/image-1778063971066.png" alt="TGG Logo" class="navbar-logo" />
            <span class="brand-title"> Leadership Compass </span>
        </a>
    </header>

    <div class="app">

        <aside class="sidebar">
            <div class="logo-row">
                <img src="static/img/image-1778063971066.png" alt="TGG Logo" class="navbar-logo" />
                <div class="logo-text">The Guinea Group</div>
            </div>

            <div class="avatar-block">
                <div class="avatar-wrap">
                    <div class="avatar">UL</div>
                    <div class="avatar-edit">✓</div>
                </div>
                <div class="avatar-name">User LastName</div>
            </div>


            <a href="dashboard.html" class="return-dashboard">
                <img class="icon" src="static/img/dashboard.png" alt="Dashboard">Return to Dashboard
            </a>

            <a href="startup.html" class="sign-out">
                <img class="icon" src="static/img/sign-out.png" alt="Sign Out">Sign Out
            </a>
        </aside>

        <main class="main">
            <h1 class="title">Account Settings</h1>

            <div class="grid">
                <div class="field">
                    <label>First Name</label>
                    <div class="input-wrap"><input type="text" value="User"></div>
                </div>
                <div class="field">
                    <label>Last Name</label>
                    <div class="input-wrap"><input type="text" value="LastName"></div>
                </div>

                <div class="field">
                    <label>Username</label>
                    <div class="input-wrap"><input type="text" value="usern@m3"></div>
                </div>
                <div class="field">
                    <label>Password</label>
                    <div class="input-wrap"><input type="password" value="******"><span class="pencil">&#9998;</span></div>
                </div>

                <div class="field">
                    <label>E-mail</label>
                    <div class="input-wrap"><input type="text" value="user.lastname@leadershipcompass.com"><span class="pencil">&#9998;</span></div>
                </div>

                <div class="field">
                    <label>Phone Number</label>
                    <div class="input-wrap"><input type="text" value="+61 307 156 023"><span class="pencil">&#9998;</span></div>
                </div>
            </div>

            <div class="actions">
                <button class="btn-save">Save</button>
                <button class="btn-cancel">Cancel</button>
            </div>
        </main>
    </div>

</body>
</html>
