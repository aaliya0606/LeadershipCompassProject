<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>View Resource | Leadership Compass</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/style/main.css" />
</head>

<body>
  <nav class="navbar navbar-dark px-4 custom-navbar">
    <a href="dashboard.html" class="navbar-brand d-flex align-items-center gap-2">
      <img src="static/img/image-1778063971066.png" alt="TGG Logo" class="navbar-logo" />
      <span class="brand-title">Leadership Compass</span>
    </a>
    <div class="d-flex flex-wrap gap-2">
      <a href="resource-library.html" class="btn btn-light">Resource Library</a>
      <a href="dashboard.html" class="btn btn-light">Dashboard</a>
    </div>
  </nav>

  <main class="container resource-view-shell">
    <a href="resource-library.html" class="resource-back-link">&larr; Back to Resource Library</a>

    <section id="resourceState" class="dashboard-card resource-view-card mt-4" aria-live="polite">
      <div class="resource-loading">Loading resource details...</div>
    </section>
  </main>

  <script>
    const apiBaseUrl = 'http://localhost:8080/api/resources';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[character]));
    }

    function formatType(type) {
      if (!type) return 'Resource';
      return type.toLowerCase() === 'ebook' ? 'eBook' : type.charAt(0).toUpperCase() + type.slice(1).toLowerCase();
    }

    function formatFileSize(bytes) {
      if (!bytes) return 'Size unavailable';
      const units = ['B', 'KB', 'MB', 'GB'];
      const unitIndex = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / Math.pow(1024, unitIndex)).toFixed(unitIndex ? 1 : 0)} ${units[unitIndex]}`;
    }

    async function openResourceFile(resource) {
      const token = localStorage.getItem('token');
      if (resource.resourceUrl) {
        window.open(resource.resourceUrl, '_blank', 'noopener');
        return;
      }

      const previewWindow = window.open('', '_blank');
      if (!previewWindow) {
        alert('Please allow pop-ups to view this resource.');
        return;
      }

      previewWindow.document.title = 'Loading resource...';
      previewWindow.document.body.innerHTML = '<p style="font-family: sans-serif; padding: 2rem;">Loading resource...</p>';

      try {
        const response = await fetch(`${apiBaseUrl}/${encodeURIComponent(resource.id)}/file`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!response.ok) throw new Error(`Failed to open resource (${response.status})`);

        const fileBlob = await response.blob();
        const fileUrl = URL.createObjectURL(fileBlob);
        previewWindow.location.href = fileUrl;
        window.setTimeout(() => URL.revokeObjectURL(fileUrl), 60000);
      } catch (error) {
        console.error('Error opening resource:', error);
        previewWindow.close();
        alert('This resource could not be opened. Please try again.');
      }
    }

    function renderResource(resource) {
      const token = localStorage.getItem('token');
      const resourceType = (resource.resourceType || 'OTHER').toLowerCase();
      const description = resource.description || 'No description has been added for this resource yet.';
      const sourceLabel = resource.resourceUrl ? 'External resource' : (resource.originalFileName || 'Stored resource file');
      const preview = resource.resourceUrl
        ? `<a class="btn btn-primary" href="${escapeHtml(resource.resourceUrl)}" target="_blank" rel="noopener">Open external resource</a>`
        : `<button type="button" class="btn btn-primary" id="openResourceBtn">Open ${escapeHtml(formatType(resource.resourceType))}</button>`;

      document.getElementById('resourceState').innerHTML = `
        <div class="resource-view-heading">
          <div>
            <span class="overview-label">${escapeHtml(formatType(resource.resourceType))}</span>
            <h1>${escapeHtml(resource.title || 'Untitled resource')}</h1>
            <div class="resource-view-tags">
              <span class="badge badge-soft-primary">${escapeHtml(resource.leadershipLanguage || 'Unclassified')}</span>
              <span class="badge badge-soft-secondary">${escapeHtml(formatType(resource.resourceType))}</span>
            </div>
          </div>
          <span class="resource-type-mark resource-type-${escapeHtml(resourceType)}">${escapeHtml(resourceType.slice(0, 3).toUpperCase())}</span>
        </div>

        <div class="resource-view-layout">
          <div class="resource-view-description">
            <h2 class="h4">About this resource</h2>
            <p>${escapeHtml(description)}</p>
            <div class="resource-view-action">${preview}</div>
          </div>

          <aside class="resource-detail-panel">
            <span class="overview-label">Resource details</span>
            <dl>
              <div><dt>Leadership language</dt><dd>${escapeHtml(resource.leadershipLanguage || 'Unclassified')}</dd></div>
              <div><dt>Format</dt><dd>${escapeHtml(formatType(resource.resourceType))}</dd></div>
              <div><dt>File</dt><dd>${escapeHtml(sourceLabel)}</dd></div>
              <div><dt>Size</dt><dd>${escapeHtml(formatFileSize(resource.fileSize))}</dd></div>
            </dl>
          </aside>
        </div>

        <div class="resource-preview-panel">
          <div>
            <span class="overview-label">Ready when you are</span>
            <h2 class="h4">Put the idea into practice.</h2>
            <p class="text-muted mb-0">Open the resource in a new tab, then return to your development plan when you are ready to act on it.</p>
          </div>
          <a href="5weekplan.html" class="btn btn-outline-primary">Return to Development Plan</a>
        </div>
      `;

      const openButton = document.getElementById('openResourceBtn');
      if (openButton) openButton.addEventListener('click', () => openResourceFile(resource));
    }

    async function loadResource() {
      const resourceId = new URLSearchParams(window.location.search).get('id');
      const token = localStorage.getItem('token');
      const state = document.getElementById('resourceState');

      if (!token) {
        state.innerHTML = '<div class="resource-status">Please log in to view this resource.</div>';
        return;
      }

      if (!resourceId) {
        state.innerHTML = '<div class="resource-status resource-status-error">No resource was selected.</div>';
        return;
      }

      try {
        const response = await fetch(`${apiBaseUrl}/${encodeURIComponent(resourceId)}`, {
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }
        });
        if (!response.ok) throw new Error(`Failed to load resource (${response.status})`);
        renderResource(await response.json());
      } catch (error) {
        console.error('Error loading resource:', error);
        state.innerHTML = '<div class="resource-status resource-status-error">This resource could not be loaded. Please return to the library and try again.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadResource);
  </script>
</body>
</html>
