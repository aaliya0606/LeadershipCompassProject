<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Guinea Group | Leadership Compass</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="static/style/startup.css" />
    <link rel="stylesheet" href="static/style/main.css" />
</head>

<body>

<header class="navbar-dark px-4 custom-navbar-new">
    <img src="static/img/TGG-logo.png" alt="TGG Logo" class="navbar-logo-new" />
    <span class="brand-title-new">Leadership Compass</span>
    <div class="social-icons">
        <a href="https://www.facebook.com/theguineagrouptgg/" target="_blank">
            <img src="static/img/facebook.png" alt="Facebook" />
        </a>
        <a href="https://www.instagram.com/anton_guinea/" target="_blank">
            <img src="static/img/instagram.png" alt="Instagram" />
        </a>
        <a href="https://www.youtube.com/@theguineagrouptgg6042" target="_blank">
            <img src="static/img/youtube.png" alt="YouTube" />
        </a>
        <a href="https://www.tiktok.com/@antonguinea" target="_blank">
            <img src="static/img/tiktok.png" alt="TikTok" />
        </a>
    </div>
</header>

<div class="login">

    <!-- RIGHT PANEL -->
    <form class="login-form" id="loginForm">
        <h2 class="signin-title">Admin Domain</h2>

        <!-- EMAIL -->
        <div class="field-group">
            <label for="loginEmail" class="field-label">Email</label>
            <input type="email" id="loginEmail" class="field-input" placeholder="Enter email" />
        </div>

        <!-- PASSWORD -->
        <div class="field-group">
            <label for="loginPassword" class="field-label">Password</label>
            <input type="password" id="loginPassword" class="field-input" placeholder="Enter password" />
        </div>

        <div class="forgot-link">
            <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
        <p id="loginMessage"></p>

        <div class="bottom-links">
            <a href="startup.html" class="adminreturn-btn">return</a>
        </div>
    </form>
    <!--
    TGG administrator email verification.
    Hidden until the administrator's password has been validated.
    No JWT is issued until this form is successfully submitted.
    -->
    <form class="login-form" id="adminVerificationForm" hidden>
        <h2 class="signin-title">Verify Your Login</h2>

        <p>
            We've sent a six-digit verification code to your
            registered administrator email address.
        </p>

        <div class="field-group">
            <label for="adminVerificationCode" class="field-label">
                Verification Code
            </label>

            <input
                type="text"
                id="adminVerificationCode"
                class="field-input"
                placeholder="Enter six-digit code"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="6"
                pattern="[0-9]{6}"
                required
            />
        </div>

        <button type="submit" class="btn-login">
            Verify & Sign In
        </button>

        <p id="adminVerificationMessage" aria-live="polite"></p>

        <div class="bottom-links">
            <button type="button" id="backToAdminLogin" class="btn-login">
                Back to Login
            </button>
        </div>
    </form>
</div>

<script src="static/js/auth.js"></script>
</body>
