<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Guinea Group | Leadership Compass</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="static/style/startup.css" />
    <link rel="stylesheet" href="static/style/main.css" />
</head>

<body>

<header class="navbar-dark px-4 custom-navbar-new">
    <img src="static/img/TGG-logo.png" alt="TGG Logo" class="navbar-logo-new" />
    <span class="brand-title-new">Leadership Compass</span>
    <div class="social-icons">
        <a href="https://www.facebook.com/theguineagrouptgg/" target="_blank">
            <img src="static/img/facebook.png" alt="Facebook" />
        </a>
        <a href="https://www.instagram.com/anton_guinea/" target="_blank">
            <img src="static/img/instagram.png" alt="Instagram" />
        </a>
        <a href="https://www.youtube.com/@theguineagrouptgg6042" target="_blank">
            <img src="static/img/youtube.png" alt="YouTube" />
        </a>
        <a href="https://www.tiktok.com/@antonguinea" target="_blank">
            <img src="static/img/tiktok.png" alt="TikTok" />
        </a>
    </div>
</header>

<div class="login">

    <!-- BUTTON sits right after subtitle -->
    <a href="startup.html" class="adminreturn-btn">return</a>

    <!-- RIGHT PANEL -->
    <form class="login-form" id="loginForm">
        <h2 class="signin-title">Admin Domain</h2>

        <!-- EMAIL -->
        <div class="field-group">
            <label for="loginEmail" class="field-label">Email</label>
            <input type="email" id="loginEmail" class="field-input" placeholder="Enter email" />
        </div>

        <!-- PASSWORD -->
        <div class="field-group">
            <label for="loginPassword" class="field-label">Password</label>
            <input type="password" id="loginPassword" class="field-input" placeholder="Enter password" />
        </div>

        <div class="forgot-link">
            <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login">Sign In</button>
        <p id="loginMessage"></p>
    </form>
</div>

<script src="static/js/auth.js"></script>
</body>
