<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Survey | Leadership Compass </title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link href="static/style/main.css" rel="stylesheet" />
  <link href="static/style/survey.css" rel="stylesheet" />
</head>

<body>
  <!-- Navigation Bar -->
  <header class="navbar-dark px-4 custom-navbar">
      <a href="survey.html" class="navbar-brand d-flex align-items-center gap-2">
          <img src="static/img/TGG-logo.png" alt="TGG Logo" class="navbar-logo" />
          <span class="brand-title"> Leadership Compass </span>
      </a>

      <nav class="nav-links-inline" id="navLinks">
          <a class="nav-link" href="dashboard.html">Dashboard</a>
          <a class="nav-link" href="5weekplan.html">5 Week Plan</a>
          <a class="nav-link" href="survey.html">Survey</a>
          <a class="nav-link" href="resource-library.html">Resource Library</a>
          <a class="nav-link" href="">My Account</a>
          <a class="nav-link logout" id="logoutBtn">Logout</a>
      </nav>

      <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
      </button>
  </header>
  <main class="survey-body">

    <!-- Survey Welcome Screen -->
    <div class="survey-container" id="surveyWelcomeContainer">
      <div class="survey-container-heading">
        <h1 class="survey-container-heading">The 5 Leadership Languages</h1>
      </div>
      <p class="survey-container-p-text">This five-part survey is designed to empower you to develop
        effective leadership skills by finding your unique strengths and areas for growth.
      </p>
      <button class="survey-button" id="startBtn">Get Started</button>
    </div>

    <!-- Progress bar -->
    <div class="survey-progress-wrapper" id="surveyProgressWrapper">
      <div class="survey-progress-meta">
        <span class="survey-progress-label" id="progressLabel">Start</span>
        <span class="survey-progress-count" id="progressCount">0 of 5 parts</span>
      </div>
      <div class="survey-progress-track" role="progressbar"
           aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
           aria-label="Survey progress" id="progressTrack">
        <div class="survey-progress-fill" id="progressFill"></div>
      </div>
    </div>
  </main>

  <script src="static/js/survey.js"></script>
  <script src="static/js/sidebar.js"></script>
</body>
</html>
