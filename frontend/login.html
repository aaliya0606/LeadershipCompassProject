<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in | Leadership Compass</title>
    <link rel="stylesheet" href="static/style/main.css" />
</head>
<body>
<div class="login">

    <! -- TOP LEFT -->
    <img src="static/img/TGG-logo.png" alt="TGG" class="logo-left" />

    <! -- TOP CENTER -->
    <img src="static/img/anton-guinea-logo-img.png" alt="Anton" class="logo-center" />

    <! TOP RIGHT -->
    <img src="static/img/social.png" alt="Social Icons" class="social-icons" />


    <! -- BUTTON sits right after subtitle -->
    <a href="startup.html" class="return-btn">return</a>

    <! -- RIGHT PANEL -->
    <form class="login-form" id="loginForm">
        <h2 class="signin-title">Sign In</h2>

        <! -- EMAIL -->
        <div class="field-group">
            <label for="loginEmail" class="field-label">Email</label>
            <input type="email" id="loginEmail" class="field-input" placeholder="Enter email" />
        </div>

        <! -- PASSWORD -->
        <div class="field-group">
            <label for="loginPassword" class="field-label">Password</label>
            <input type="password" id="loginPassword" class="field-input" placeholder="Enter password" />
        </div>

        <div class="forgot-link">
            <a href="#">Forgot password?</a>
        </div>

        <button class="btn-login">Sign In</button>
        <p id="loginMessage"></p>
    </form>
    <! -- ALREADY HAVE AN ACCOUNT -->
    <p class="signup-link">Don't have an account? <a href="sign-up.html">Sign Up</a></p>
</div>

<script src="static/js/auth.js"></script>
</body>
</html>
