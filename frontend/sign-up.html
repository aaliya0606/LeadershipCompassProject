<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Guinea Group | Leadership Compass</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="static/style/startup.css" />
    <link rel="stylesheet" href="static/style/main.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header class="navbar-dark px-4 custom-navbar-new">
    <img src="static/img/TGG-logo.png" alt="TGG Logo" class="navbar-logo-new" />
    <img src="static/img/anton-guinea-logo-img.png" alt="Anton Guinea Logo" class="anton-logo"/>
    <span class="brand-title-new">Leadership Compass</span>
    <div class="social-icons">
        <a href="https://www.facebook.com/theguineagrouptgg/" target="_blank">
            <img src="static/img/facebook.png" alt="Facebook" />
        </a>
        <a href="https://www.instagram.com/anton_guinea/" target="_blank">
            <img src="static/img/instagram.png" alt="Instagram" />
        </a>
        <a href="https://www.youtube.com/@theguineagrouptgg6042" target="_blank">
            <img src="static/img/youtube.png" alt="YouTube" />
        </a>
        <a href="https://www.tiktok.com/@antonguinea" target="_blank">
            <img src="static/img/tiktok.png" alt="TikTok" />
        </a>
    </div>
</header>

<div class="sign-up">

    <!-- BUTTON sits right after subtitle -->
    <a href="startup.html" class="return-btn-signup" >return</a>

    <!-- RIGHT PANEL -->
    <form class="sign-up-form" id="registerForm">
        <h2 class="signin-title">Sign Up</h2>

        <!-- FIRST NAME -->
        <div class="field-row">
            <div class="field-group">
                <label for="registerFirstName" class="field-label">First Name</label>
                <input type="text" id="registerFirstName" class="field-input" placeholder="Enter first name"/>
            </div>


        <!-- LAST NAME -->
            <div class="field-group">
                <label for="registerLastName" class="field-label">Last Name</label>
                <input type="text" id="registerLastName" class="field-input" placeholder="Enter last name"/>
            </div>

        </div>


        <!-- EMAIL -->
        <div class="field-group">
            <label for="registerEmail" class="field-label">Email</label>
            <input type="email" id="registerEmail" class="field-input" placeholder="Enter email" />
        </div>

        <!-- PASSWORD -->
        <div class="field-group">
            <label for="registerPassword" class="field-label">Password</label>
            <input type="password" id="registerPassword" class="field-input" placeholder="Enter password" />
        </div>

        <!-- RE-ENTER PASSWORD -->
        <div class="field-group">
            <label for="confirmPassword" class="field-label">Re-enter Password</label>
            <input type="password" id="confirmPassword" class="field-input" placeholder="Re-enter your password" />
        </div>

        <!-- ROLE -->
        <div class="field-group">
            <label for="registerRole" class="field-label">Role</label>
            <select id="registerRole" class="field-input">
                <option value="USER" selected>User</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>

        <button type="submit" class="btn-login">Sign Up</button>

        <p id="registerMessage"></p>
    </form>

    <! -- ALREADY HAVE AN ACCOUNT -->
    <p class="login-link">Already have an account? <a href="login.html">Sign In</a></p>
    <script src="static/js/auth.js"></script>
</div>
</body>
</html>
